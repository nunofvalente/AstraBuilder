version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:20.19
    resource_class: medium

jobs:
  test:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-cache-v1-{{ checksum "package-lock.json" }}
            - npm-cache-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run tests
          command: npm test
      - run:
          name: Build app
          command: npm run build

workflows:
  ci:
    jobs:
      - test
