version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:20.19
    resource_class: medium

jobs:
  test:
    executor: node
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-cache-v1-{{ checksum "package-lock.json" }}
            - npm-cache-v1-
      - restore_cache:
          keys:
            - next-cache-v1-{{ .Branch }}-{{ checksum "package-lock.json" }}
            - next-cache-v1-{{ .Branch }}-
            - next-cache-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run tests
          command: npm test
      - run:
          name: Build app
          command: npm run build
      - save_cache:
          key: next-cache-v1-{{ .Branch }}-{{ checksum "package-lock.json" }}
          paths:
            - .next/cache

workflows:
  ci:
    jobs:
      - test
